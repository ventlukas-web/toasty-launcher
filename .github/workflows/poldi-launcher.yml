name: Build Poldi Client Launcher
on:
  push:
    paths:
      - 'poldi-launcher/**'
      - '.github/workflows/poldi-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: poldi-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'   # Minecraft 26.x braucht Java 25
      - name: Poldi Client Mod einbauen
        run: |
          mkdir -p out/bundled rel
          J=$(ls mod/poldi-client*.jar 2>/dev/null | grep -v -e sources -e dev | head -1 || true)
          if [ -n "$J" ]; then
            cp "$J" out/bundled/poldi-client.jar
            cp "$J" "rel/$(basename "$J")"
          else
            echo "::warning::Keine poldi-client*.jar in poldi-launcher/mod/ – Launcher startet 26.2 erst, wenn die Mod da ist."
          fi
      - name: Compile
        run: |
          mkdir -p dist
          javac -encoding UTF-8 -d out $(find src -name "*.java")
          cp res/logo.png out/
          date -u +%Y-%m-%dT%H:%M:%SZ > out/build.txt
          printf 'Main-Class: dev.poldi.launcher.Main\n' > manifest.txt
          jar cfm dist/poldi-launcher.jar manifest.txt -C out .
      - name: Package exe
        run: |
          jpackage --type app-image --name PoldiClient --input dist --main-jar poldi-launcher.jar \
            --main-class dev.poldi.launcher.Main --icon res/icon.ico --dest pkg \
            --add-modules java.se,jdk.unsupported,jdk.naming.dns,jdk.crypto.ec,jdk.localedata,jdk.zipfs \
            --java-options "-Dsun.java2d.uiScale.enabled=true"
          cd pkg && 7z a -tzip ../PoldiClient-windows.zip PoldiClient
      - uses: actions/upload-artifact@v4
        with:
          name: PoldiClient-windows
          path: poldi-launcher/PoldiClient-windows.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete poldi-launcher-latest --yes --cleanup-tag || true
          shopt -s nullglob; MODJAR=(rel/*.jar)
          gh release create poldi-launcher-latest PoldiClient-windows.zip dist/poldi-launcher.jar "${MODJAR[@]}" \
            --title "Poldi Client" --notes "Poldi Client Launcher: ZIP entpacken, PoldiClient.exe starten. Hauptversion 26.2 mit Poldi Client Mod, alle anderen Versionen mit Fabric."
