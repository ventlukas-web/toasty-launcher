name: Build Toasty Launcher
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip entpacken
        shell: bash
        run: |
          if [ -f toasty-launcher.zip ]; then unzip -oq toasty-launcher.zip && cp -rf toasty-launcher/. . ; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Toasty Client einbauen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/bundled
          gh release download latest -R ventlukas-web/toasty-client -p "toasty-client-*.jar" -D bundled_tmp || true
          J=$(ls bundled_tmp/toasty-client-*.jar 2>/dev/null | grep -v -e sources -e dev | head -1 || true)
          if [ -n "$J" ]; then cp "$J" out/bundled/toasty-client.jar; else echo "Kein Client-Release gefunden, Launcher laedt ihn spaeter."; fi
      - name: Compile
        shell: bash
        run: |
          mkdir -p out dist
          javac -encoding UTF-8 -d out $(find src -name "*.java")
          cp res/logo.png out/
          date -u +%Y-%m-%dT%H:%M:%SZ > out/build.txt
          printf 'Main-Class: dev.toasty.launcher.Main\n' > manifest.txt
          jar cfm dist/toasty-launcher.jar manifest.txt -C out .
      - name: Package exe
        shell: bash
        run: |
          jpackage --type app-image --name ToastyLauncher --input dist --main-jar toasty-launcher.jar \
            --main-class dev.toasty.launcher.Main --icon res/icon.ico --dest pkg \
            --add-modules java.se,jdk.unsupported,jdk.naming.dns,jdk.crypto.ec,jdk.localedata,jdk.zipfs \
            --java-options "-Dsun.java2d.uiScale.enabled=true"
          cd pkg && 7z a -tzip ../ToastyLauncher-windows.zip ToastyLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: ToastyLauncher-windows
          path: ToastyLauncher-windows.zip
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest ToastyLauncher-windows.zip --title "Toasty Launcher" --notes "Windows-Launcher: ZIP entpacken, ToastyLauncher.exe starten."
